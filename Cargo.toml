[workspace]
resolver = "2"
members = ["crates/sshash-lib", "crates/sshash-cli", "crates/sshash-py", "crates/tiny-dict"]
default-members = ["crates/sshash-lib", "crates/sshash-cli"]

[workspace.package]
version = "0.6.3"
edition = "2024"
rust-version = "1.85"
authors = ["SSHash Contributors"]
license-file = "LICENSE"
repository = "https://github.com/COMBINE-lab/sshash-rs"
keywords = ["data-structures", "succinct", "index"]
categories = ["command-line-utilities", "data-structures"]

[workspace.dependencies]
# Core library
sshash-lib = { version = "0.6.3", path = "crates/sshash-lib" }
tiny-dict = { version = "0.6.3", path = "crates/tiny-dict" }

# Succinct data structures
sux = { version = "0.14.0", features = ["epserde"] }

# Minimal perfect hashing (COMBINE-lab fork: usize::MAX instead of panic for out-of-set keys)
#ph = { git = "https://github.com/COMBINE-lab/bsuccinct-rs.git", branch = "main", default-features = false, features = ["rapidhash"] }
ph = { package = "ph-temp", version = "0.12.0", default-features = false, features = [
  "rapidhash",
] }

# FASTA/FASTQ parsing
needletail = "0.7"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# CLI
clap = { version = "4.6", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Parallelism
rayon = "1.12"

# Memory mapping and temp files (for external sorting)
memmap2 = "0.9"
tempfile = "3.27"

# Utilities
seq-macro = "0.3"

[profile.release]
lto = "thin"
