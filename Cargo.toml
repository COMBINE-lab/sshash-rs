[workspace]
resolver = "2"
members = ["crates/sshash-lib", "crates/sshash-cli", "crates/sshash-py", "crates/tiny-dict"]
default-members = ["crates/sshash-lib", "crates/sshash-cli"]

[workspace.package]
version = "0.7.1"
edition = "2024"
rust-version = "1.88"
authors = ["SSHash Contributors"]
license-file = "LICENSE"
repository = "https://github.com/COMBINE-lab/sshash-rs"
keywords = ["data-structures", "succinct", "index"]
categories = ["command-line-utilities", "data-structures"]

[workspace.dependencies]
# Core library
sshash-lib = { version = "0.7.1", path = "crates/sshash-lib" }
tiny-dict = { version = "0.7.1", path = "crates/tiny-dict" }

# Succinct data structures
# Succinct data structures and the minimizer/k-mer MPHF (PHastR). 0.15.2 adds
# PHastRBuilder::sweep_chunks and ::temp_dir, used by the streaming MPHF build.
sux = { version = "0.15.2", features = ["epserde"] }

# FASTA/FASTQ parsing
needletail = "0.7"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# CLI
clap = { version = "4.6", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Parallelism
rayon = "1.12"

# Memory mapping and temp files (for external sorting)
memmap2 = "0.9"
tempfile = "3.27"

# Utilities
seq-macro = "0.3"

[profile.release]
lto = "thin"
