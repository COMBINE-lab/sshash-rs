[package]
name = "tiny-dict"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license-file.workspace = true
repository.workspace = true
description = "Fast hashbrown-based k-mer dictionary for small references (drop-in alternative to sshash)"

[dependencies]
sshash-lib = { workspace = true }
hashbrown = "0.17"
# Pinned: rapidhash's fast hashers are not guaranteed stable across crate
# versions (see rapidhash docs). A version bump would silently invalidate
# on-disk .tdct files. `.tdct` headers record this version and refuse to
# load if it does not match.
rapidhash = "=4.4.0"
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
rand = "0.10"
tempfile = { workspace = true }
