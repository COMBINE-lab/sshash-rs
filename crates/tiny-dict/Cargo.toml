[package]
name = "tiny-dict"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license-file.workspace = true
repository.workspace = true
description = "Fast hashbrown-based k-mer dictionary for small references (drop-in alternative to sshash)"

[dependencies]
sshash-lib = { workspace = true }
hashbrown = "0.17"
# Pinned: rapidhash's fast hashers are not guaranteed stable across crate
# versions (see rapidhash docs), so the version is chosen deliberately rather
# than floated. `.tdct` headers record the version that wrote them and the load
# path accepts only versions verified to hash identically -- see
# io::ACCEPTED_RAPIDHASH_VERSIONS, which must be extended (with evidence)
# whenever this pin moves.
rapidhash = "=4.5.1"
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
rand = "0.10"
tempfile = { workspace = true }
