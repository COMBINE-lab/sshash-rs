[package]
name = "sshash-lib"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license-file.workspace = true
repository.workspace = true
description = "Sparse and Skew Hashing of k-mers - Core library"

[dependencies]
# Succinct data structures
sux = { workspace = true }

# Minimal perfect hashing  
ph = { workspace = true }

# FASTA/FASTQ parsing
needletail = { workspace = true }

# Serialization
epserde = "0.12.6" # Must match sux's epserde version

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

# Parallelism
rayon = { workspace = true }

# Utilities for const generic generation
seq-macro = { workspace = true }

# Fast, portable hashing (CPU-feature independent — no AES-NI divergence unlike ahash)
rapidhash = "4"

# Value-based slice traits (used by sux BitFieldVec)
value-traits = "0.2"

# Memory usage measurement (must match sux's version)
mem_dbg = "0.4.4"

# Memory mapping (for external sorting)
memmap2 = { workspace = true }

[dev-dependencies]
# Testing utilities
rand = "0.10"
proptest = "1.11"
tempfile = "3.27"
