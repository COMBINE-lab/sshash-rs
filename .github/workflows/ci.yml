name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Debug tests carry the heavy invariants: the incremental minimizer is
      # checked against the batch reference on every call, and every streaming
      # result against its point lookup.
      - name: cargo test (debug, all invariant asserts active)
        run: cargo test --workspace
      - name: cargo test (release)
        run: cargo test --workspace --release
      - name: heavy minimizer property grid
        run: cargo test --release -p sshash-lib --test minimizer_properties -- --ignored
      - name: clippy (informational — pre-existing lints not yet triaged)
        run: cargo clippy --workspace --all-targets
        continue-on-error: true
